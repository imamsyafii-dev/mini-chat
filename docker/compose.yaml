name: mini-chat

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mini_chat
      POSTGRES_PASSWORD: ${MINI_CHAT_POSTGRES_PASSWORD:?MINI_CHAT_POSTGRES_PASSWORD is required}
      POSTGRES_DB: mini_chat
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - mini-chat-network

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:26380:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - mini-chat-network

volumes:
  postgres-data:
    name: mini-chat-postgres-data

networks:
  mini-chat-network:
    name: mini-chat-network
